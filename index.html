<style>
/* Layout : colonne d'app pour téléphone (max 560px) — en-tête collant, 5 onglets en bas, fiches qui montent du bas */
:root{
  --bg:#F5F7FB;--surface:#FFFFFF;--surface-2:#EBEFF6;--line:#D9E0EC;--fg:#0F1A2C;--muted:#5C687C;
  --accent:#183A78;--accent-ink:#FFFFFF;--accent-soft:#E2E9F6;
  --hot:#2F64C0;--live-soft:#E2E9F6;
  --sun:#4A78C8;--sun-soft:#E2E9F6;--sun-ink:#183A78;--star:#E3B000;
  --ok:#0F7A57;--ok-ink:#FFFFFF;--ok-soft:#DCF2E8;--warn:#6A4BC0;--warn-soft:#ECE6FA;--bad:#BD3227;--bad-soft:#FBE4E1;--info:#2A5BC4;--info-soft:#E3EBFB;
  --p-tiktok:#0F1A2C;--p-insta:#C2338A;--p-fb:#1D6FE0;--p-wa:#17A04C;--p-live:#D7263D;--p-vitrine:#0E9AA7;--live-ink:#FFFFFF;
  --t1:#DDE6F6;--t2:#D6EEF0;--t3:#D5EEE2;--t4:#E9E1F7;--t5:#F6DDE4;
  --scrim:rgba(15,26,44,.45);
  --shadow:0 1px 2px rgba(15,35,80,.08),0 8px 24px rgba(15,35,80,.14);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120;--surface:#131B2D;--surface-2:#1B2539;--line:#28344C;--fg:#EDF1F8;--muted:#9AA6BB;
    --accent:#86ABF6;--accent-ink:#0A1428;--accent-soft:#1A2A4B;
    --hot:#9DBBF7;--live-soft:#1A2A4B;
    --sun:#86ABF6;--sun-soft:#1A2A4B;--sun-ink:#CFE0FF;--star:#FFCC33;
    --ok:#4FCB97;--ok-ink:#06281A;--ok-soft:#123326;--warn:#B9A6FF;--warn-soft:#262047;--bad:#FF7B6E;--bad-soft:#3D1714;--info:#86AAFF;--info-soft:#17264A;
    --p-tiktok:#EDF1F8;--p-insta:#F06BBE;--p-fb:#5B9BFF;--p-wa:#3FD07A;--p-live:#FF6B7A;--p-vitrine:#2CC6C6;--live-ink:#2A0008;
    --t1:#1D2B4A;--t2:#143A40;--t3:#173A2B;--t4:#2E2548;--t5:#43202D;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1120;--surface:#131B2D;--surface-2:#1B2539;--line:#28344C;--fg:#EDF1F8;--muted:#9AA6BB;
  --accent:#86ABF6;--accent-ink:#0A1428;--accent-soft:#1A2A4B;
  --hot:#9DBBF7;--live-soft:#1A2A4B;
  --sun:#86ABF6;--sun-soft:#1A2A4B;--sun-ink:#CFE0FF;--star:#FFCC33;
  --ok:#4FCB97;--ok-ink:#06281A;--ok-soft:#123326;--warn:#B9A6FF;--warn-soft:#262047;--bad:#FF7B6E;--bad-soft:#3D1714;--info:#86AAFF;--info-soft:#17264A;
  --p-tiktok:#EDF1F8;--p-insta:#F06BBE;--p-fb:#5B9BFF;--p-wa:#3FD07A;--p-live:#FF6B7A;--p-vitrine:#2CC6C6;--live-ink:#2A0008;
  --t1:#1D2B4A;--t2:#143A40;--t3:#173A2B;--t4:#2E2548;--t5:#43202D;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
h3{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
.eyebrow{margin:0 0 5px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--hot)}
.muted{color:var(--muted)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lead{color:var(--muted);max-width:60ch}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:21px;height:21px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand strong{font-family:var(--f-display);font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:var(--muted);font-weight:700}
.demo-pill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--sun-soft);color:var(--sun-ink);padding:4px 9px;border-radius:999px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);flex:none;padding:0}
.icon-btn svg{width:19px;height:19px}

main{display:flex;flex-direction:column;gap:22px;padding-block:18px 96px}
.blk{display:flex;flex-direction:column;gap:10px}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* Accueil */
.hello{display:flex;flex-direction:column;gap:6px}
.hello .lead b{color:var(--fg)}
.demo-note{font-size:13px;color:var(--sun-ink);background:var(--sun-soft);border-radius:12px;padding:10px 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
button.stat:active{transform:scale(.985)}
.stat .k{font-size:12.5px;font-weight:800;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.stat .s{font-size:12.5px;color:var(--muted)}
.stat.hot{background:var(--sun-soft);border-color:transparent}
.stat.hot .k,.stat.hot .s,.stat.hot .v{color:var(--sun-ink)}
.stat.good .v{color:var(--ok)}
.quick{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}

.todo{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.todo button{display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 13px;width:100%}
.todo button:first-child{border-top:0}
.todo .tx{flex:1;min-width:0}
.todo b{display:block;font-weight:700}
.todo small{display:block;color:var(--muted);font-size:12.5px}
.todo .chev{color:var(--muted);flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.info{background:var(--info)}.dot.sun{background:var(--sun)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.ok{background:var(--ok)}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sbar{display:flex;gap:3px;height:14px;border-radius:7px;overflow:hidden;margin-block:4px}
.sbar i{display:block;height:100%}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px 14px;font-size:13.5px}
.legend li{display:flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.src-insight{font-size:14px}

.clients-row{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.clients-row .tx{flex:1;min-width:0}
.clients-row small{display:block;color:var(--muted);font-size:12.5px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;text-decoration:none;text-align:center;line-height:1.2}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ok{background:var(--ok);color:var(--ok-ink)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row>*{flex:1 1 130px}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:800;text-align:left;align-self:flex-start}
.linkbtn.danger{color:var(--bad)}
.x{width:32px;height:32px;border-radius:9px;border:0;background:var(--surface-2);color:var(--muted);font-size:18px;line-height:1;display:grid;place-items:center;flex:none;padding:0}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.65}
.chip .sw{width:8px;height:8px;border-radius:50%}

.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st-info{background:var(--info-soft);color:var(--info)}
.st-sun{background:var(--sun-soft);color:var(--sun-ink)}
.st-warn{background:var(--warn-soft);color:var(--warn)}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-bad{background:var(--bad-soft);color:var(--bad)}
.src{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.src i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tags{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Commandes */
#oq{margin-bottom:-6px}
.olist{display:flex;flex-direction:column;gap:10px}
.ocard{display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;color:var(--fg)}
.ocard>span{display:flex;align-items:center;gap:8px;min-width:0}
.ocard .when{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.onum{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.oc-name{font-weight:800;font-size:16px}
.oc-name .q{font-weight:500;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ocard .oc-items{display:block;color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-l3 .amt{font-family:var(--f-display);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.oc-l3 .pay{font-size:12.5px;color:var(--muted)}
.rider-tag{margin-left:auto;font-size:12px;font-weight:700;background:var(--surface-2);padding:3px 8px;border-radius:8px;white-space:nowrap}

/* Fiches */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:20px 20px 0 0;padding-block:0 calc(26px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.sh-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:flex-start;gap:12px;padding-block:16px 12px;border-bottom:1px solid var(--line)}
.sh-head>div{flex:1;min-width:0}
.sh-head h2{overflow-wrap:anywhere}

.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;font-weight:800}
.fld em{font-style:normal;font-weight:500;color:var(--muted)}
input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--fg);min-width:0}
textarea{resize:vertical;min-height:62px;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:350px){.grid2{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted)}
.hint.good{color:var(--ok);font-weight:700}
.hint:empty{display:none}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--accent)}

.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.ln-name{font-weight:800;min-width:0;display:flex;flex-direction:column}
.ln-name small{font-weight:700;color:var(--sun-ink);background:var(--sun-soft);border-radius:6px;padding:1px 6px;align-self:flex-start;font-size:11.5px;margin-top:3px}
.ln-ctrl{display:flex;gap:8px;align-items:center;grid-column:1/-1;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.qty button{width:38px;height:38px;border:0;background:var(--surface-2);font-weight:800;font-size:18px;padding:0}
.qty b{min-width:32px;text-align:center;font-variant-numeric:tabular-nums}
.ln-ctrl select{width:auto;padding:8px 10px}
.ln-ctrl .pr{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.ln-ctrl .pr input{width:104px;padding:8px 10px;font-variant-numeric:tabular-nums}
.pick{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.pick button{flex:none;width:98px;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:8px 6px;font-size:12px;font-weight:700;text-align:center;color:var(--fg)}
.pick button span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}
.pick .tile{width:44px;height:44px;font-size:13px}
.pick small{color:var(--muted);font-weight:600}

.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14.5px}
.kv>span{color:var(--muted);min-width:0}
.kv>b{font-variant-numeric:tabular-nums;text-align:right}
.kv.total{font-size:17px;padding-top:7px;border-top:1px solid var(--line)}
.kv.total>span{color:var(--fg);font-weight:800}
.kv.total>b{font-family:var(--f-display)}
.kv.hl{background:var(--sun-soft);margin-inline:-6px;padding:7px 6px;border-radius:9px}
.kv.hl>span,.kv.hl>b{color:var(--sun-ink)}
.kv.gain>b{color:var(--ok)}
.sel{user-select:all;-webkit-user-select:all}
.msg{white-space:pre-wrap;font-family:var(--f-body);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;margin:0;overflow-wrap:anywhere}
.done{font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:10px;padding:10px 12px}

/* Live */
.live-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.live-toggle{border:0;border-radius:999px;padding:10px 14px;font-weight:800;font-size:13.5px;display:inline-flex;gap:8px;align-items:center;background:var(--surface-2);color:var(--fg);flex:none}
.live-toggle .rec{width:10px;height:10px;border-radius:50%;background:var(--p-live)}
.live-toggle.on{background:var(--p-live);color:var(--live-ink)}
.live-toggle.on .rec{background:currentColor;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.live-on{font-size:13.5px;font-weight:700;color:var(--p-live)}
.live-stats{display:flex;flex-wrap:wrap;gap:8px}
.live-stats span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.live-stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.lnum{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none;font-variant-numeric:tabular-nums}
.lnum.lg{width:58px;height:58px;font-size:24px;border-radius:14px}
.lnum.sm{width:30px;height:30px;font-size:13px;border-radius:9px}
.lv-item.cur{border-color:var(--p-live);box-shadow:inset 0 0 0 1px var(--p-live)}
.now{display:block;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--p-live)}
.timer{white-space:nowrap;color:var(--warn)}
.timer small{font-size:12px;font-weight:700}
.timer b{font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.resa-l{font-size:13.5px;color:var(--muted)}
.resa-l b{color:var(--fg)}
.resa.off{opacity:.62}

  try{if(navigator.geolocation){navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;cb({lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5)});},fb,{enableHighAccuracy:true,timeout:6000,maximumAge:60000});setTimeout(fb,7000);}else fb();}catch(e){fb();}}
/* Accès du livreur aux données du client : seulement pendant la livraison, 24 h au plus après le retrait */
var ACCES_H=24;
function accesFin(o){var base=((o.hist&&o.hist.en_route)||o.date)+ACCES_H*3600e3;return Math.max(o.accesJusqua||0,base);}
function livAccess(o){return o.statut!=='en_route'||Date.now()<accesFin(o);}
function finTxt(t){return (new Date(t).toDateString()===new Date().toDateString()?'':'demain ')+hm(t);}
/* Partage de la livraison entre livreurs */
function partsOf(o){return o.parts||[];}
function deN(n){return (/^[aeiouyhâéèêîïôûAEIOUYHÂÉÈÊÎÏÔÛ]/.test(n)?'d\'':'de ')+n;}
function addTrace(o,txt){o.trace=o.trace||[];o.trace.push({t:Date.now(),txt:txt});}
function prenom(l){return l?l.nom.split(' ')[0]:'';}
function declared(id){return S.commandes.filter(function(o){return o.livreurId===id&&owes(o)&&o.remise;});}
function newCode(){var c,n=MODE==='owner'?6:4;do{c=String(Math.pow(10,n-1)+Math.floor(Math.random()*9*Math.pow(10,n-1)));}while(S.livreurs.some(function(l){return l.code===c;}));return c;}

function itemsTxt(o){return o.lignes.map(function(l){return (l.qte>1?l.qte+' × ':'')+l.nom+(l.taille?' ('+l.taille+')':'');}).join(', ');}
function plural(n,a,b){return n+' '+(n>1?b:a);}

function render(){

  document.querySelectorAll('.tab').forEach(function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  var n=S.commandes.filter(function(o){return o.statut==='nouvelle';}).length, bd=$('#badge');
  bd.textContent=n;bd.hidden=!n;
  $('#shopName').textContent=S.shop.nom||'Ma boutique';
  $('#fab').hidden=!(tab==='home'||tab==='orders');

  (MODE==='demo'?'<div class="demo-note">Exemple : ces commandes sont fictives, pour essayer l\'app. Touchez tout ce que vous voulez.'+(onSite()?' <button class="linkbtn" data-act="go-welcome">Créer ma vraie boutique →</button>':'')+'</div>':'')+startCard()+
  '<div class="stats">'+
    '<button class="stat" data-act="go-orders" data-f="nouvelle"><span class="k">À traiter</span><span class="v">'+aTraiter+'</span><span class="s">'+plural(nouv.length,'nouvelle','nouvelles')+' · '+plural(conf.length,'confirmée','confirmées')+'</span></button>'+

/* Live : les clients réservent eux-mêmes, acompte Wave, annulation automatique */
function lnum(pid){return S.live.items.indexOf(pid)+1;}
function hasPid(r,pid){return r.lignes.some(function(l){return l.pid===pid;});}
function rTot(r){return r.lignes.reduce(function(a,l){var p=prod(l.pid);return a+(p?p.vente:0)*l.qte;},0);}
function rTxt(r){return r.lignes.map(function(l){var p=prod(l.pid);return 'N°'+(lnum(l.pid)||'–')+' '+(p?p.nom:'Article supprimé')+(l.taille?' ('+l.taille+')':'')+(l.qte>1?' ×'+l.qte:'');}).join(', ');}
function pending(pid){return S.live.resa.filter(function(r){return r.statut==='attente';}).reduce(function(a,r){return a+r.lignes.filter(function(l){return l.pid===pid;}).reduce(function(b,l){return b+l.qte;},0);},0);}
function avail(pid){var p=prod(pid);if(MODE==='public')return p?Math.max(0,+p.avail||0):0;return p?Math.max(0,p.stock-pending(pid)):0;}
function waitN(pid){return S.live.resa.filter(function(r){return r.statut==='liste'&&hasPid(r,pid);}).length;}
function dueAmt(r){var t=rTot(r);return S.live.acompte<0?t:Math.min(t,S.live.acompte);}
function promoteAll(r){var w=null;r.lignes.forEach(function(l){w=w||promote(l.pid);});return w;}
function acoTxt(){return S.live.acompte<0?'la totalité':F(S.live.acompte);}
function left(ts){var s=Math.max(0,Math.round((ts-Date.now())/1000)),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0');}
function promote(pid){if(MODE!=='demo')return null;var w=S.live.resa.filter(function(r){return r.statut==='liste'&&hasPid(r,pid);}).sort(function(a,b){return a.date-b.date;})[0];if(w&&w.lignes.every(function(l){return avail(l.pid)>=l.qte;})){w.statut='attente';w.expire=Date.now()+S.live.delai*60e3;w.promu=true;return w;}return null;}
function expireCheck(){var now=Date.now(),msgs=[];S.live.resa.forEach(function(r){if(r.statut==='attente'&&r.expire<=now){r.statut='expiree';var w=promoteAll(r);msgs.push((r.client.nom||'Un client')+' n\'a pas payé : réservation annulée'+(w?'. '+w.client.nom+' passe en premier':''));}});return msgs;}
function liveLink(){return vitrineLink()+'&live';}
function rappel(r){var nom=(r.client.nom||'').split(' ')[0];return 'Bonjour'+(nom?' '+nom:'')+' 👋\nVous avez réservé pendant notre live : '+rTxt(r)+'. Total : '+F(rTot(r))+'.\nPour confirmer, envoyez l\'acompte de '+F(dueAmt(r))+' avant '+hm(r.expire)+(methods().length?' :\n'+payNums():'.')+'\nSans paiement, la réservation sera annulée.\n'+(S.shop.nom||'');}
function payBox(r){var m=methods();if(!m.length)return '<p class="hint">La boutique va vous contacter sur WhatsApp pour confirmer.</p>';return '<div class="card blk"><p>Pour confirmer, envoyez l\'acompte de <b>'+F(dueAmt(r))+'</b> par '+methodsTxt()+' :</p>'+m.map(function(k){return '<div class="kv"><span>'+PM[k]+'</span><b class="sel">'+fmtTel(S.shop[k])+'</b></div><button class="btn sm ghost" data-act="copy" data-text="'+fmtTel(S.shop[k])+'">Copier le numéro '+PMS[k]+'</button>';}).join('')+'</div>';}
function resaCard(r){
  var line='<p class="resa-l">'+esc(rTxt(r))+' · <b>'+F(rTot(r))+'</b> · '+(r.mode==='retrait'?'<b>Retrait sur place</b>':esc(r.client.quartier||'—'))+'</p>';
  var name='<b>'+esc(r.client.nom||fmtTel(r.client.tel))+'</b>';
  if(r.statut==='attente')return '<article class="resa"><div class="resa-top">'+name+'<span class="timer"><small>reste</small> <b data-exp="'+r.expire+'">'+left(r.expire)+'</b></span></div>'+line+
    '<p class="resa-l">Acompte attendu : <b>'+F(dueAmt(r))+'</b>'+(r.promu?' · <span class="pill st-info">Venue de la liste</span>':'')+'</p>'+
    '<div class="btn-row">'+methods().map(function(k,_,m){return '<button class="btn sm ok" data-act="rs-paid" data-v="'+k+'" data-id="'+r.id+'">'+(m.length>1?'Payé '+PMS[k]:'Payé')+'</button>';}).join('')+'<button class="btn sm soft" data-act="rs-trust" data-id="'+r.id+'">Confirmé sans acompte</button></div>'+
    '<div class="btn-row"><a class="btn sm ghost" href="'+wa(r.client.tel,rappel(r))+'" target="_blank" rel="noopener">Rappel WhatsApp</a><button class="btn sm ghost" data-act="rs-more" data-id="'+r.id+'">+'+S.live.delai+' min</button></div><button class="linkbtn danger" data-act="rs-cancel" data-id="'+r.id+'">Annuler la réservation</button></article>';
  if(r.statut==='liste')return '<article class="resa"><div class="resa-top">'+name+'<span class="pill st-warn">Liste d\'attente</span></div>'+line+'<p class="hint">Elle passe en premier si une réservation est annulée.</p><button class="linkbtn danger" data-act="rs-cancel" data-id="'+r.id+'">Retirer</button></article>';
  if(r.statut==='payee'){var o=byId(r.orderId);return '<article class="resa"><div class="resa-top">'+name+'<span class="pill st-ok">Payée</span></div>'+line+(o?'<button class="linkbtn" data-act="open-order" data-id="'+o.id+'">Voir la commande #'+o.num+'</button>':'')+'</article>';}
  return '<article class="resa off"><div class="resa-top">'+name+'<span class="pill st-bad">'+(r.statut==='expiree'?'Pas payé':'Annulée')+'</span></div>'+line+'</article>';
}

function tpl(o,k){
  var shop=S.shop.nom||'notre boutique', nom=(o.client.nom||'').split(' ')[0], hi='Bonjour'+(nom&&nom.charAt(0)!=='@'?' '+nom:''), r=rider(o.livreurId), enc=aEncaisser(o);

  if(k==='confirm'){
    var rt=o.mode==='retrait', where=rt?'sur place':'à la livraison';
    var pay=o.pay==='livraison'?'À payer '+where+' : '+F(enc):o.pay==='acompte'?'Acompte reçu : '+F(o.acompte)+'\nReste à payer '+where+' : '+F(enc):'Articles déjà payés par '+(PM[o.pay]||'')+' ✅'+(o.frais?'\nLivraison à régler au livreur : '+F(o.frais):'');
    return hi+' 👋\nVotre commande n°'+o.num+' chez '+shop+' est confirmée :\n'+lines+(rt?'':'\nLivraison : '+F(o.frais))+'\nTotal : '+F(total(o))+'\n'+pay+'\n\n'+(rt?'Retrait : '+(S.shop.adresse||'à la boutique'):'Adresse : '+(o.client.quartier||'à préciser'))+'\nMerci pour votre confiance 🙏';

  return '📦 Colis n°'+o.num+' · '+shop+'\nClient : '+(o.client.nom||'—')+' · '+(fmtTel(o.client.tel)||'—')+'\nAdresse : '+(o.client.quartier||'—')+'\n'+lines+'\nÀ encaisser : '+F(enc)+' (dont livraison '+F(o.frais)+')'+(o.note?'\nNote : '+o.note:'');
}

function readPhoto(file,cb,mx0){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var mx=mx0||420,s=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);var q=.8,u=c.toDataURL('image/jpeg',q);while(u.length>480000&&q>.45){q-=.08;u=c.toDataURL('image/jpeg',q);}cb(u);};img.src=r.result;};r.readAsDataURL(file);}

function cartKey(ctx){return 'teranga-shop-panier-'+(MODE==='public'?PUBCODE+'-':'')+ctx;}
function loadCart(ctx){try{var r=localStorage.getItem(cartKey(ctx));return r?JSON.parse(r):null;}catch(e){return null;}}
function saveCart(){if(!cart)return;cart.back=0;try{localStorage.setItem(cartKey(cart.ctx),JSON.stringify({lines:cart.lines.concat(cart.away||[]),nom:cart.nom,tel:cart.tel,quartier:cart.quartier,mode:cart.mode,t:Date.now()}));}catch(e){}}
function newCart(ctx){
  var c={ctx:ctx,step:'list',lines:[],away:[],back:0,nom:'',tel:'',quartier:'',mode:'livraison',pid:'',taille:'',rid:'',onum:0}, sv=loadCart(ctx);
  if(!sv)return c;
  ['nom','tel','quartier'].forEach(function(k){c[k]=String(sv[k]||'');});
  if(sv.mode==='retrait'&&S.shop.retrait)c.mode='retrait';
  var used={};
  (sv.lines||[]).forEach(function(l){var p=prod(l.pid);if(!p||!(l.qte>0))return;
    var max=ctx==='lv'?(S.live.items.indexOf(p.id)>=0?avail(p.id):0):(p.visible?(p.stock>0?p.stock:10):0), q=Math.min(l.qte,max-(used[p.id]||0));
    if(q>0){var ex=c.lines.filter(function(x){return x.pid===p.id&&x.taille===(l.taille||'');})[0];if(ex)ex.qte+=q;else c.lines.push({pid:p.id,qte:q,taille:l.taille||''});used[p.id]=(used[p.id]||0)+q;c.back+=q;}
    else if(ctx==='lv'&&p.visible)c.away.push({pid:p.id,qte:l.qte,taille:l.taille||''});});
  return c;}
function sizes(p){return p&&p.tailles?p.tailles.split(',').map(function(s){return s.trim();}).filter(Boolean):[];}
function cartQty(pid,t){return cart.lines.filter(function(l){return l.pid===pid&&(t===undefined||l.taille===t);}).reduce(function(a,l){return a+l.qte;},0);}
function cartMax(pid){var p=prod(pid);if(!p)return 0;return cart.ctx==='lv'?avail(pid):(p.stock>0?p.stock:10);}
function cartAdd(pid,t,d){if(!prod(pid))return;t=t||'';if(d>0&&cartQty(pid)>=cartMax(pid)){toast(cart.ctx==='lv'?'Il n\'en reste plus':'Plus de stock pour cet article');return;}var l=cart.lines.filter(function(x){return x.pid===pid&&x.taille===t;})[0];if(!l){if(d<0)return;l={pid:pid,qte:0,taille:t};cart.lines.push(l);}l.qte+=d;if(l.qte<=0)cart.lines.splice(cart.lines.indexOf(l),1);cart.back=0;saveCart();}
function cartTot(){return cart.lines.reduce(function(a,l){var p=prod(l.pid);return a+(p?p.vente:0)*l.qte;},0);}
function cartN(){return cart.lines.reduce(function(a,l){return a+l.qte;},0);}
function qtyCtl(pid,t,q){return '<span class="qty"><button data-act="c-dec" data-id="'+pid+'" data-t="'+esc(t)+'" aria-label="Enlever un">−</button><b>'+q+'</b><button data-act="c-inc" data-id="'+pid+'" data-t="'+esc(t)+'" aria-label="Ajouter un">+</button></span>';}
function addCtl(p){
  var ts=sizes(p), q=cartQty(p.id);
  if(cart.ctx==='lv'&&avail(p.id)<=0&&!q)return '<button class="btn sm ghost" data-act="cw-wait" data-id="'+p.id+'">Liste d\'attente</button>';
  if(ts.length)return '<div class="szs" role="group" aria-label="'+esc(optNom(p))+'">'+ts.map(function(t){var n=cartQty(p.id,t);return '<button class="chip sz'+(n?' on':'')+'" data-act="c-inc" data-id="'+p.id+'" data-t="'+esc(t)+'">'+esc(t)+(n?' · '+n:'')+'</button>';}).join('')+'</div>';

function authGo(btn){
  var ph=normTel(AUTH.tel), pw=AUTH.pw, su=AUTH.su;
  if(su&&!AUTH.nom.trim())return renderAuth('Écrivez le nom de votre boutique');
  if(ph.length!==9)return renderAuth('Numéro : 9 chiffres, par exemple 77 000 00 00');
  if(pw.length<6)return renderAuth('Mot de passe : 6 caractères minimum');
  if(su&&pw!==AUTH.pw2)return renderAuth('Les deux mots de passe ne sont pas pareils');

    .catch(function(e){renderAuth(errMsg(e));});
  });

/* ---------- Compte du vendeur : synchronisation ---------- */
function ownKey(){return 'teranga-shop-owner-'+(USER&&USER.id||'');}
function startOwner(){
  setMode('owner');LOADED=false;var cache=null;
  try{cache=JSON.parse(lsGet(ownKey())||'null');}catch(e){}
  if(cache&&cache.S){S=cache.S;SNAP=cache.SNAP||{};LAST=cache.LAST||'';STOCKQ=cache.STOCKQ||{};ALERTS=cache.ALERTS||{};attachAlerts();LOADED=true;render();}
  else{S=emptyS();SNAP={};LAST='';STOCKQ={};ALERTS={};$('#shopName').textContent='Teranga Shop';$('#view').innerHTML='<p class="empty">Chargement de votre boutique…</p>';}
  checkAcc().then(function(ok){if(!ok)return;return (cache?flush().then(function(){return pull();}):pull(true)).then(function(){LOADED=true;afterPull({n:1,news:[]});if(needOnb())openOnb(1);});})
    .catch(function(e){NETOK=false;if(cache)render();else $('#view').innerHTML='<p class="empty">Pas de connexion internet.</p><button class="btn block" data-act="reload">Réessayer</button>';toast(errMsg(e));});
  clearInterval(PULLT);PULLT=setInterval(function(){if(document.visibilityState==='hidden'||MODE!=='owner'||!LOADED)return;var lv=S.live&&(S.live.actif||tab==='live');if(!lv&&(PULLN=PULLN+1)%2)return;flush().then(function(){return pull();}).then(afterPull,function(){render();});},4000);
  clearInterval(ACCT);ACCT=setInterval(function(){if(MODE==='owner')checkAcc().catch(function(){});},3600e3);
}
function checkAcc(){return rpc('shop_compte').then(function(a){return a&&a.ok?a:rpc('shop_inscription',{p_nom:''});})
  .then(function(a){ACC=a;if(!a.actif){showBlocked();return false;}if(MODE==='blocked')startOwner();return true;});}
function canon(x){if(x===undefined)return 'null';if(x===null||typeof x!=='object')return JSON.stringify(x);
  if(Array.isArray(x))return '['+x.map(canon).join(',')+']';
  return '{'+Object.keys(x).filter(function(k){return x[k]!==undefined;}).sort().map(function(k){return JSON.stringify(k)+':'+canon(x[k]);}).join(',')+'}';}
function omit(o,ks){var r={};Object.keys(o||{}).forEach(function(k){if(ks.indexOf(k)<0)r[k]=o[k];});return r;}
function shape(col,o){if(col==='produits'){var r=omit(o,['stock','alertes','stock0']),ph=pics(o).filter(function(u){return !isData(u);});r.photos=ph;r.photo=ph[0]||'';return r;}return col==='set'&&o&&o.resa?omit(o,['resa']):o;}
function entities(){var m={};
  m['set|shop']=S.shop;m['set|live']=S.live;
  S.produits.forEach(function(p){m['produits|'+p.id]=p;(p.alertes||[]).forEach(function(a){if(!a.id){a.id='al'+Date.now()+rnd(3);ALERTS[a.id]=a;}a.pid=p.id;m['alertes|'+a.id]=a;});});
  S.commandes.forEach(function(o){m['commandes|'+o.id]=o;});
  S.livreurs.forEach(function(l){m['livreurs|'+l.id]=l;});
  (S.avis||[]).forEach(function(a){m['avis|'+a.id]=a;});
  S.live.resa.forEach(function(r){m['resa|'+r.id]=r;});
  return m;}
function listOf(col){return col==='produits'?S.produits:col==='commandes'?S.commandes:col==='livreurs'?S.livreurs:col==='avis'?(S.avis=S.avis||[]):col==='resa'?S.live.resa:null;}
function putEnt(col,id,data){var o=JSON.parse(JSON.stringify(data||{}));
  if(col==='set'){if(id==='shop')S.shop=Object.assign(emptyS().shop,o);else if(id==='live'){var rs=S.live.resa;S.live=Object.assign(emptyS().live,o);S.live.resa=rs;}return;}
  if(col==='alertes'){o.id=id;ALERTS[id]=o;return;}
  var arr=listOf(col);if(!arr)return;o.id=id;
  if(col==='produits'){o.stock=Math.max(0,(+o.stock||0)+(STOCKQ[id]||0));o.alertes=[];}
  var i=arr.map(function(x){return x.id;}).indexOf(id);if(i>=0)arr[i]=o;else arr.push(o);}
function removeEnt(col,id){if(col==='alertes'){delete ALERTS[id];return;}var arr=listOf(col);if(!arr)return;var i=arr.map(function(x){return x.id;}).indexOf(id);if(i>=0)arr.splice(i,1);}
function attachAlerts(){var all=Object.keys(ALERTS).map(function(k){return ALERTS[k];});
  S.produits.forEach(function(p){p.alertes=all.filter(function(a){return a.pid===p.id;}).sort(function(a,b){return a.date-b.date;});});}
function applyRows(rows,full){var n=0,news=[],ents=full?{}:entities();
  rows.forEach(function(r){var key=r.col+'|'+r.id, cur=ents[key];
    if(!LAST||r.updated_at>LAST)LAST=r.updated_at;
    if(r.col==='produits'&&cur&&!r.deleted){var st=Math.max(0,(+r.data.stock||0)+(STOCKQ[r.id]||0));if(cur.stock!==st){cur.stock=st;n++;}}
    if(cur&&(SNAP[key]===undefined||canon(shape(r.col,cur))!==SNAP[key]||(r.col==='produits'&&pics(cur).some(isData))))return;   // changement local pas encore envoyé : il gagne
    if(r.deleted){if(cur){removeEnt(r.col,r.id);n++;}delete SNAP[key];return;}
    var cs=canon(shape(r.col,r.data));if(cur&&SNAP[key]===cs)return;
    if(!cur&&LOADED&&r.col==='commandes'&&r.data.statut==='nouvelle')news.push(r.data);
    if(!cur&&LOADED&&r.col==='resa'&&r.data.statut==='attente')news.push({resa:1,client:r.data.client});
    putEnt(r.col,r.id,r.data);SNAP[key]=cs;n++;});
  if(n)attachAlerts();
  return {n:n,news:news};}
var PULLING=null;
function pull(full){
  if(MODE!=='owner'||!SB)return Promise.resolve({n:0,news:[]});
  if(PULLING)return PULLING;
  full=full||(!LAST&&!Object.keys(SNAP).length);
  var since=full||!LAST?'1970-01-01T00:00:00Z':new Date(new Date(LAST).getTime()-5000).toISOString(), got=[];
  var live=S.live&&(S.live.actif||S.live.resa.some(function(r){return r.statut==='attente'||r.statut==='liste';}));
  function page(from){return SB.from('shop_rows').select('col,id,data,deleted,updated_at').gt('updated_at',since).order('updated_at',{ascending:true}).range(from,from+999)
    .then(function(r){if(r.error)throw r.error;got=got.concat(r.data||[]);if((r.data||[]).length===1000)return page(from+1000);});}
  PULLING=(live?rpc('shop_tick').catch(function(){}):Promise.resolve()).then(function(){return page(0);})
    .then(function(){PULLING=null;NETOK=true;var res=applyRows(got,full);saveCache();return res;},
          function(e){PULLING=null;NETOK=false;throw e;});
  return PULLING;}
function afterPull(res){if(!res||MODE!=='owner'||ONB)return;
  var ae=document.activeElement, typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.closest&&ae.closest('#view');
  if(res.n&&!typing){render();var sh=$('#sheetWrap');if(sh&&!sh.hidden&&liv&&liv.id&&!liv.deliver&&!liv.pass&&!liv.pay)openLivreur(true);}
  (res.news||[]).forEach(function(x,i){if(i>2)return;toast(x.resa?'Nouvelle réservation : '+(x.client&&x.client.nom||'un client'):'Nouvelle commande #'+x.num+' · '+(x.client&&x.client.nom||''));});
  if(res.news&&res.news.length)bip();}
function bip(){try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;var c=bip.c||(bip.c=new A()),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18);}catch(e){}}
var FLUSHING=null, FLUSHAGAIN=false;
function schedulePush(){clearTimeout(PUSHT);PUSHT=setTimeout(function(){flush().then(function(){return pull();}).then(afterPull,function(){});},400);}
function flush(){
  if(MODE!=='owner'||!SB||!LOADED)return Promise.resolve();
  if(FLUSHING){FLUSHAGAIN=true;return FLUSHING;}
  S.produits.forEach(function(p){if(pics(p).some(isData))uploadPhotos(p.id);});
  var ents=entities(), ops=[], snaps={}, incs=[], sent={};
  Object.keys(ents).forEach(function(k){var col=k.split('|')[0], id=k.slice(col.length+1), sh=shape(col,ents[k]), cs=canon(sh);
    if(SNAP[k]===cs)return;
    var old=SNAP[k]?JSON.parse(SNAP[k]):null, patch={};
    if(!old)patch=JSON.parse(JSON.stringify(sh));
    else Object.keys(sh).concat(Object.keys(old)).forEach(function(f){if(canon(sh[f])!==canon(old[f]))patch[f]=sh[f]===undefined?null:sh[f];});
    ops.push({col:col,id:id,patch:patch});snaps[k]=cs;});
  Object.keys(SNAP).forEach(function(k){if(!(k in ents)){var col=k.split('|')[0];ops.push({col:col,id:k.slice(col.length+1),del:true});snaps[k]=null;}});
  Object.keys(STOCKQ).forEach(function(pid){if(STOCKQ[pid]){incs.push({col:'produits',id:pid,inc:{stock:STOCKQ[pid]}});sent[pid]=STOCKQ[pid];}});
  if(!ops.length&&!incs.length){saveCache();return Promise.resolve();}
  var all=ops.concat(incs), chunks=[];for(var i=0;i<all.length;i+=300)chunks.push(all.slice(i,i+300));
  FLUSHING=chunks.reduce(function(p,ch){return p.then(function(){return rpc('shop_put',{p_ops:ch});});},Promise.resolve())
    .then(function(){Object.keys(snaps).forEach(function(k){if(snaps[k]===null)delete SNAP[k];else SNAP[k]=snaps[k];});
      Object.keys(sent).forEach(function(pid){STOCKQ[pid]=(STOCKQ[pid]||0)-sent[pid];if(!STOCKQ[pid])delete STOCKQ[pid];});NETOK=true;},
      function(e){NETOK=false;if(/abonnement/i.test(errMsg(e)))checkAcc().catch(function(){});})
    .then(function(){FLUSHING=null;saveCache();if(FLUSHAGAIN){FLUSHAGAIN=false;return flush();}});
  return FLUSHING;}
var CACHET=null;
function saveCache(){clearTimeout(CACHET);CACHET=setTimeout(function(){if(MODE==='owner'&&USER)lsSet(ownKey(),JSON.stringify({S:S,SNAP:SNAP,LAST:LAST,STOCKQ:STOCKQ,ALERTS:ALERTS}));},300);}
function setStock(p,v){v=Math.max(0,Math.round(+v||0));var d=v-(+p.stock||0);p.stock=v;if(d&&MODE==='owner')STOCKQ[p.id]=(STOCKQ[p.id]||0)+d;}
function newTk(){return rnd(16);}
function dataUrlBlob(u){var a=u.split(','),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]),n=b.length,x=new Uint8Array(n);while(n--)x[n]=b.charCodeAt(n);return new Blob([x],{type:m});}
var UPL={};
function uploadPhotos(pid){var p=prod(pid);if(MODE!=='owner'||!p||!USER||!SB||UPL[pid])return;var todo=pics(p).filter(isData);if(!todo.length)return;UPL[pid]=1;
  todo.reduce(function(pr,src,i){return pr.then(function(){var path=USER.id+'/'+pid+'-'+Date.now()+'-'+i+'.jpg';
    return SB.storage.from('shop-photos').upload(path,dataUrlBlob(src),{contentType:'image/jpeg',upsert:true}).then(function(r){if(r.error)throw r.error;
      var url=SB.storage.from('shop-photos').getPublicUrl(path).data.publicUrl,q=prod(pid);if(!q)return;var l=pics(q),k=l.indexOf(src);if(k>=0){l[k]=url;q.photos=l;q.photo=l[0];}});});},Promise.resolve())
  .catch(function(){}).then(function(){delete UPL[pid];save();});}

function openZoom(pid,i){var p=prod(pid),list=pics(p);if(!list.length)return;
  var el=$('#lb');if(!el){el=document.createElement('div');el.id='lb';el.className='lb';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el);}
  el.innerHTML='<div class="lb-top"><b>'+esc(p.nom)+'</b><span class="lb-n"></span><button class="lb-x" data-act="zoom-close" aria-label="Fermer">×</button></div>'+
    '<div class="lb-track">'+list.map(function(u,k){return '<div class="lb-slide"><img src="'+u+'" alt="'+esc(p.nom)+' · photo '+(k+1)+'" data-act="zoom-tap"></div>';}).join('')+'</div>'+
    '<div class="lb-foot"><b>'+F(p.vente)+'</b><span>Touchez la photo pour zoomer'+(list.length>1?' · glissez pour voir la suivante':'')+'</span></div>';
  el.hidden=false;document.body.style.overflow='hidden';
  var tr=el.querySelector('.lb-track');tr.scrollLeft=tr.clientWidth*(i||0);tr.onscroll=updZoom;updZoom();}
function updZoom(){var el=$('#lb');if(!el||el.hidden)return;var tr=el.querySelector('.lb-track'),n=tr.children.length,i=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));el.querySelector('.lb-n').textContent=n>1?(i+1)+' / '+n:'';}
function closeZoom(){var el=$('#lb');if(!el)return;el.hidden=true;el.innerHTML='';if(solo()||$('#sheetWrap').hidden)document.body.style.overflow='';}
function zoomTap(img,e){var sl=img.parentNode,tr=sl.parentNode,r=img.getBoundingClientRect(),fx=(e.clientX-r.left)/Math.max(1,r.width),fy=(e.clientY-r.top)/Math.max(1,r.height);
  if(img.classList.toggle('z')){tr.classList.add('lock');sl.scrollLeft=fx*img.offsetWidth-sl.clientWidth/2;sl.scrollTop=fy*img.offsetHeight-sl.clientHeight/2;}
  else{tr.classList.remove('lock');sl.scrollLeft=0;sl.scrollTop=0;}}

/* ---------- Actions propres à chaque mode ---------- */
function handleMode(a,b,id){
  switch(a){
    case 'reload':location.reload();return true;
    case 'zoom':openZoom(id,+b.dataset.i||0);return true;
    case 'zoom-close':closeZoom();return true;
    case 'ph-del':if(pdraft){pdraft.photos.splice(+b.dataset.i,1);pdraft.photo=pdraft.photos[0]||'';renderProduct(true);}return true;
    case 'ph-main':if(pdraft){var ph=pdraft.photos.splice(+b.dataset.i,1)[0];pdraft.photos.unshift(ph);pdraft.photo=ph;renderProduct(true);}return true;
    case 'w-new':AUTH.su=true;renderAuth();return true;
    case 'w-login':AUTH.su=false;renderAuth();return true;
    case 'w-back':startWelcome();return true;
    case 'w-demo':lsSet('teranga-shop-mode','demo');startDemo();return true;
    case 'go-welcome':lsSet('teranga-shop-mode',null);closeSheet();whenSB(function(){startWelcome();});return true;
    case 'au-switch':AUTH.su=!AUTH.su;renderAuth();return true;
    case 'au-go':authGo(b);return true;
    case 'pay-check':b.disabled=true;checkAcc().then(function(ok){if(ok)toast('Abonnement actif, merci !');else{b.disabled=false;toast('Pas encore reçu : réessayez dans un moment ou écrivez à Seck Apps');}},function(e){b.disabled=false;toast(errMsg(e));});return true;
    case 's-logout':if(MODE==='owner'&&!armed(b,'Touchez encore pour vous déconnecter'))return true;
      flush().catch(function(){}).then(function(){return SB?SB.auth.signOut():null;}).catch(function(){}).then(function(){lsSet('teranga-shop-mode',null);location.reload();});return true;
    case 'ob-next':if(ONB.step===1&&!String(ONB.nom||'').trim()){toast('Écrivez le nom de votre boutique');return true;}
      if(ONB.step===2){var bad=['wave','om','mixx'].filter(function(k){var d=normTel(ONB[k]);return d&&d.length!==9;});if(bad.length){toast('Numéro '+PM[bad[0]]+' incomplet : 9 chiffres');return true;}}
      if(ONB.step<=2)onbSaveShop();
      if(ONB.step===2&&ACC&&S.shop.nom&&ACC.code&&ACC.code.indexOf('boutique-')===0){var sl=S.shop.nom.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30);
        if(sl.length>=3)rpc('shop_set_code',{p_code:sl}).then(function(c){ACC.code=c;}).catch(function(){});}
      openOnb(ONB.step+1);return true;
    case 'ob-back':openOnb(Math.max(1,ONB.step-1));return true;
    case 'ob-frais':ONB.frais=+b.dataset.v;openOnb(2);return true;
    case 'ob-add':{var pp=ONB.p;if(!pp.nom.trim()){toast('Écrivez le nom de l\'article');return true;}if(!num(pp.vente)){toast('Écrivez le prix de vente');return true;}
      var np={id:'p'+Date.now(),nom:pp.nom.trim(),cat:'',achat:num(pp.achat),vente:num(pp.vente),stock:0,tailles:'',optNom:'',arrivage:'',visible:true,photo:pp.photo||'',photos:pp.photo?[pp.photo]:[],alertes:[]};
      S.produits.push(np);setStock(np,num(pp.stock)||1);save();uploadPhotos(np.id);ONB.p={nom:'',vente:'',achat:'',stock:'1',photo:''};openOnb(3);toast('Article ajouté');return true;}
    case 'ob-end':S.shop.onb=true;save();ONB=null;setMode('owner');go('home');return true;
    case 'push-on':pushOn(b);return true;
    case 'push-test':pushTest();return true;
    case 'push-off':pushOff();return true;
    case 'story-share':shareStory();return true;
    case 'p-img':openStory(id||(pdraft&&pdraft.id));return true;
    case 'c-myresa':cart.rid=id;cart.step='done';openClient();resaEtat(id).then(function(){if(cart&&cart.step==='done')openClient(true);});return true;
  }
  if(MODE==='livreur')return handleLiv(a,b,id);
  if(MODE==='public'){
    if(a==='c-send'||a==='c-sendwait'){pubSend(a,b);return true;}
    if(a==='c-suivi'){location.search=suiviURL(cart.oid,cart.otk);return true;}
    if(a==='c-resa-suivi'){location.search=suiviURL(b.dataset.id,b.dataset.k);return true;}
    if(a==='suivi-avis'){var sk=new URLSearchParams(location.search).get('k')||'';location.search='?b='+encodeURIComponent(PUBCODE)+'&a='+encodeURIComponent(id||'')+'&k='+encodeURIComponent(sk);return true;}
    if(a==='avis-suivi'&&avf){location.search=suiviURL(avf.oid,avf.tk);return true;}
    if(a==='c-sendalert'){if(!cart.nom.trim()||normTel(cart.tel).length<9){toast('Écrivez votre nom et votre numéro WhatsApp');return true;}
      b.disabled=true;rpc('shop_alerte',{p_code:PUBCODE,p_pid:cart.pid,p_nom:cart.nom.trim(),p_tel:normTel(cart.tel)}).then(function(){cart.step='alertdone';saveCart();openClient();},function(e){b.disabled=false;toast(errMsg(e));});return true;}
    if(a==='av-send'){b.disabled=true;rpc('shop_avis_envoyer',{p_code:PUBCODE,p_id:avf.oid,p_tk:avf.tk||'',p_note:avf.note,p_texte:(avf.texte||'').trim(),p_photo:avf.photo||''}).then(function(){avf.sent=true;openAvis();toast('Merci pour votre avis !');},function(e){b.disabled=false;toast(errMsg(e));});return true;}
    if(a==='c-orders'||a==='close')return true;
    return false;}
  if(MODE==='owner'){
    if(a==='vitrine'){window.open('https://'+vitrineLink(),'_blank');return true;}
    if(a==='live-client'){window.open('https://'+liveLink(),'_blank');return true;}
    if(a==='liv-open'){window.open('https://'+livLink(),'_blank');return true;}
    if(a==='o-avis'){var oa=byId(id);if(oa)window.open('https://'+avisLink(oa),'_blank');return true;}
    if(a==='s-reset')return true;
    if(a==='s-code'){var cd=String(sdraft&&sdraft.code||'').toLowerCase().trim();b.disabled=true;
      rpc('shop_set_code',{p_code:cd}).then(function(c){ACC.code=c;toast('Nouveau lien : '+vitrineLink());openShop();},function(e){b.disabled=false;toast(errMsg(e));});return true;}
  }
  return false;}

    case 'r-save':{
      var rd=rdraft;if(!rd.nom.trim()){toast('Écrivez le nom du livreur');break;}
      rd.nom=rd.nom.trim();rd.tel=normTel(rd.tel);
      if(rd.id)S.livreurs=S.livreurs.map(function(x){return x.id===rd.id?rd:x;});else{rd.id='l'+Date.now();S.livreurs.push(rd);}
      save();closeSheet();render();toast('Livreur enregistré');break;}
    case 'r-del':if(!armed(b,'Touchez encore pour retirer'))break;S.livreurs=S.livreurs.filter(function(x){return x.id!==rdraft.id;});save();closeSheet();render();break;
    case 'r-newcode':rdraft.code=newCode();riderSheet(true);break;
    case 'liv-open':liv={id:'',code:''};openLivreur();break;
    case 'lv-as':liv={id:id};openLivreur();break;
    case 'lv-login':{var lc=S.livreurs.filter(function(l){return l.acces&&l.code===String(liv.code||'').trim();})[0];if(!lc){toast('Code incorrect');break;}liv={id:lc.id};openLivreur();break;}
    case 'lv-logout':liv={id:'',code:''};openLivreur();break;
    case 'lv-back':liv.deliver=liv.pass=liv.passTo='';liv.pay=false;openLivreur(true);break;
    case 'lv-pick':o=byId(id);setSt(o,'en_route');addTrace(o,'Récupéré à la boutique par '+prenom(rider(liv.id)));save();render();openLivreur(true);toast('Colis récupéré');break;
    case 'lv-done':o=byId(id);if(aEncaisser(o)>0){liv.deliver=id;openLivreur(true);break;}setSt(o,'livree');o.verse=true;addTrace(o,'Livré par '+prenom(rider(liv.id)));save();render();openLivreur(true);toast('Livré');break;
    case 'lv-paid':{o=byId(id);var me2=prenom(rider(liv.id));setSt(o,'livree');
      if(b.dataset.v==='direct'){o.payeVia='direct';o.verse=true;addTrace(o,'Livré par '+me2+' · le client dit avoir payé directement la boutique (à vérifier)');}
      else{o.verse=aRemettre(o)===0;addTrace(o,'Livré par '+me2+' · payé en espèces');}
      liv.deliver='';save();render();openLivreur(true);toast('Livré');break;}
    case 'lv-absent':if(!armed(b,'Touchez encore pour confirmer'))break;o=byId(id);setSt(o,'retour');stockBack(o,1);addTrace(o,'Client absent : colis ramené par '+prenom(rider(liv.id)));save();render();openLivreur(true);toast('Retour noté');break;
    case 'lv-pass':{var oth=S.livreurs.filter(function(l){return l.id!==liv.id;});liv.pass=id;liv.passTo=oth.length===1?oth[0].id:'';liv.partMode='moitie';liv.partX='';openLivreur(true);break;}
    case 'lv-pass-who':liv.passTo=b.dataset.v;openLivreur(true);break;
    case 'lv-part':liv.partMode=b.dataset.v;openLivreur(true);if(b.dataset.v==='autre'){var px=document.querySelector('[data-lv="partX"]');if(px)px.focus();}break;
    case 'lv-part-ok':{o=byId(id);var pp=partsOf(o)[+b.dataset.v];if(!pp)break;pp.ok=true;addTrace(o,prenom(rider(pp.de))+' a reçu sa part de la livraison ('+F(pp.m)+') '+deN(prenom(rider(pp.a))));save();render();openLivreur(true);toast('Part reçue, c\'est noté');break;}
    case 'lv-pass-to':{o=byId(id);var to=rider(liv.passTo),fr=rider(liv.id);if(!to){toast('Choisissez un livreur');break;}
      var f0=o.frais||0, pm0=liv.partMode||'moitie', part=null;
      if(f0&&pm0==='moitie')part=Math.round(f0/2);
      else if(f0&&pm0==='autre'){if(String(liv.partX||'').trim()===''){toast('Écrivez votre part');break;}part=Math.min(num(liv.partX),f0);}
      var ptx=!f0?'':part==null?' · la livraison, ils s\'arrangent entre eux':' · part de '+prenom(fr)+' : '+F(part);
      liv.pass='';liv.passTo='';
      if(to.acces){o.transfert={de:fr.id,vers:to.id,t:Date.now(),part:part};addTrace(o,prenom(fr)+' passe le colis à '+prenom(to)+ptx);toast(prenom(to)+' doit confirmer qu\'il a le colis');}
      else{o.livreurId=to.id;if(part)o.parts=partsOf(o).concat([{de:fr.id,a:to.id,m:part,ok:false}]);addTrace(o,prenom(fr)+' a passé le colis à '+prenom(to)+' (sans espace livreur)'+ptx);toast('Colis passé à '+prenom(to));}
      save();render();openLivreur(true);break;}
    case 'lv-pass-cancel':o=byId(id);if(o.transfert){addTrace(o,prenom(rider(liv.id))+' a annulé le passage');o.transfert=null;}save();render();openLivreur(true);break;
    case 'lv-accept':{o=byId(id);if(!o.transfert)break;var fr2=rider(o.transfert.de),to2=rider(liv.id),pt=o.transfert.part;o.livreurId=to2.id;o.transfert=null;
      if(pt)o.parts=partsOf(o).concat([{de:fr2.id,a:to2.id,m:pt,ok:false}]);
      addTrace(o,prenom(to2)+' a reçu le colis '+deN(prenom(fr2))+(pt?' · '+prenom(fr2)+' recevra '+F(pt)+' à la livraison':''));save();render();openLivreur(true);toast('Colis accepté');break;}
    case 'lv-refuse':{o=byId(id);if(!o.transfert)break;addTrace(o,prenom(rider(liv.id))+' a refusé le colis');o.transfert=null;save();render();openLivreur(true);break;}
    case 'lv-remit-ask':liv.pay=true;openLivreur(true);break;
    case 'lv-remit':{var me3=rider(liv.id),lst2=S.commandes.filter(function(x){return x.livreurId===me3.id&&owes(x)&&!x.remise;}),sm=lst2.reduce(function(a2,x){return a2+aRemettre(x);},0);
      lst2.forEach(function(x){x.remise={via:b.dataset.v,t:Date.now()};addTrace(x,prenom(me3)+' dit avoir envoyé l\'argent ('+(PM[b.dataset.v]||'en main propre')+')');});
      liv.pay=false;save();render();openLivreur(true);toast('Envoi de '+F(sm)+' déclaré à la boutique');break;}
    case 'rider-paid':{var tot=riderOwed(id);S.commandes.forEach(function(x){if(x.livreurId===id&&owes(x)){x.verse=true;x.remise=null;addTrace(x,'Argent reçu par la boutique');}});save();render();toast(F(tot)+' reçus de '+rider(id).nom);break;}

    case 'client-order':closeSheet();newDraft({client:{nom:b.dataset.nom||'',tel:b.dataset.tel||'',quartier:b.dataset.q||''},src:'wa'});break;
    case 's-save':{
      var bad=['wave','om','mixx'].filter(function(k){var d=normTel(sdraft[k]);return d&&d.length!==9;});
      if(bad.length){toast('Numéro '+PM[bad[0]]+' incomplet : 9 chiffres');break;}
      S.shop.nom=(sdraft.nom||'').trim()||'Ma boutique';S.shop.tel=normTel(sdraft.tel);
      S.shop.wave=normTel(sdraft.wave);S.shop.om=normTel(sdraft.om);S.shop.mixx=normTel(sdraft.mixx);
      S.shop.retrait=sdraft.retrait;S.shop.adresse=(sdraft.adresse||'').trim();S.shop.frais=num(sdraft.frais);
      save();closeSheet();render();toast(methods().length?'Enregistré · paiement : '+methodsTxt():'Enregistré · aucun numéro de paiement');break;}
    case 's-reset':if(!armed(b,'Oui, revenir aux exemples'))break;S=seed();q='';filt='all';save();closeSheet();go('home');toast('Démo recommencée');break;
  }
});

document.addEventListener('input',function(e){
  var t=e.target, k;
  if(t.id==='oq'){q=t.value;renderOrderList();return;}
  if(k=t.dataset.au){AUTH[k]=t.value;return;}
  if(ONB&&(k=t.dataset.ob)){ONB[k]=t.value;return;}
  if(ONB&&(k=t.dataset.obp)){ONB.p[k]=t.value;return;}
  if(cart&&(k=t.dataset.c)){cart[k]=t.value;if(k!=='maps')saveCart();return;}
  if(avf&&(k=t.dataset.a)){avf[k]=t.value;return;}
  if(liv&&(k=t.dataset.lv)){liv[k]=t.value;return;}
  if(draft&&(k=t.dataset.d)){
    if(k==='msg'){scanMsg(t.value);return;}
    if(k==='acompte'){draft.acompte=num(t.value);updSum();return;}
    if(k==='fraisx'){draft.frais=num(t.value);document.querySelectorAll('[data-act="d-frais"]').forEach(function(c){c.setAttribute('aria-pressed',String(+c.dataset.v===draft.frais&&t.value!==''));});updSum();return;}
    if(k==='note'){draft.note=t.value;return;}
    draft.client[k]=t.value;if(k==='tel')knownClient();return;
  }
  if(draft&&t.dataset.k==='prix'){draft.lignes[+t.dataset.ln].prix=num(t.value);updSum();return;}
  if(pdraft&&(k=t.dataset.p)){pdraft[k]=['achat','vente','stock'].indexOf(k)>=0?num(t.value):t.value;if(k==='achat'||k==='vente')updMarge();return;}
  if(rdraft&&(k=t.dataset.r)){rdraft[k]=t.value;return;}
  if(sdraft&&(k=t.dataset.s)){sdraft[k]=t.value;return;}
});
document.addEventListener('change',function(e){
  var t=e.target, c=t.dataset.ch;
  if(t.id==='av_photo'&&t.files&&t.files[0]){readPhoto(t.files[0],function(u){if(!avf)return;avf.photo=u;openAvis(true);});return;}
  if(t.id==='ob_photo'&&t.files&&t.files[0]){readPhoto(t.files[0],function(u){if(!ONB)return;ONB.p.photo=u;openOnb(3);},900);return;}
  if(t.id==='p_photo'&&t.files&&t.files[0]){var fs=[].slice.call(t.files,0,Math.max(0,3-(pdraft&&pdraft.photos||[]).length));fs.forEach(function(f){readPhoto(f,function(u){if(!pdraft||pdraft.photos.length>=3)return;pdraft.photos.push(u);pdraft.photo=pdraft.photos[0];renderProduct(true);},1280);});return;}
  if(!c)return;
  if(c==='o-rider'){var o=byId(t.dataset.id);o.livreurId=t.value;o.transfert=null;if(t.value)addTrace(o,'La boutique confie le colis à '+prenom(rider(t.value)));save();render();showOrder(o.id,true);toast(t.value?'Livreur choisi':'Livreur retiré');}
  else if(c==='d-taille'&&draft){draft.lignes[+t.dataset.ln].taille=t.value;}
  else if(c==='p-vis'&&pdraft){pdraft.visible=t.checked;}
  else if(c==='cw-taille'&&cart){cart.taille=t.value;}
  else if(c==='r-acces'&&rdraft){rdraft.acces=t.checked;if(t.checked&&!rdraft.code)rdraft.code=newCode();riderSheet(true);}
  else if(c==='s-retrait'&&sdraft){sdraft.retrait=t.checked;}
  else if(c==='ob-retrait'&&ONB){ONB.retrait=t.checked;openOnb(2);}
  else if(c==='lv-item'){var it=S.live.items,ix=it.indexOf(t.dataset.id);if(t.checked&&ix<0)it.push(t.dataset.id);else if(!t.checked&&ix>=0){it.splice(ix,1);if(S.live.current===t.dataset.id)S.live.current='';}save();render();openLiveItems(true);}
});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if($('#lb')&&!$('#lb').hidden){closeZoom();return;}if(!$('#sheetWrap').hidden)closeSheet();});
document.addEventListener('click',function(e){var im=e.target.closest&&e.target.closest('[data-act="zoom-tap"]');if(im){e.stopPropagation();zoomTap(im,e);}},true);

boot();
})();
</script>
</body>
